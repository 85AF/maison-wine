<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050403">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <link href="assets/css/luxury-theme.css" rel="stylesheet">
  <link href="assets/css/company-split.css" rel="stylesheet">
  <title>Catálogo Maison Blanche | Maison Wine Collection</title>
</head>
<body data-page="catalogo" data-company="maison">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb-mini"><a href="index.html">Inicio</a><i class="bi bi-chevron-right"></i><a href="maison-blanche.html">Maison Blanche</a><i class="bi bi-chevron-right"></i><span>Catálogo</span></div>
        <h1>Catálogo Maison Blanche</h1>
        <p>Solo vinos de Trapiche y El Esteco.</p>
      </div>
    </section>
    <section class="section-padding">
      <div class="container">
        <div class="catalog-toolbar mb-4 catalog-search-panel">
          <div class="row g-3 align-items-end">
            <div class="col-lg-5"><label class="form-label fw-bold">Buscar</label><input id="catalogSearch" class="form-control" type="search" placeholder="Nombre, cepa, bodega, región, maridaje..."></div>
            <div class="col-sm-6 col-lg-3"><label class="form-label fw-bold">País</label><select id="countryFilter" class="form-select"><option>Todos</option><option>Argentina</option></select></div>
            <div class="col-sm-6 col-lg-4"><label class="form-label fw-bold">Bodega</label><select id="wineryFilter" class="form-select"><option>Todos</option><option>Trapiche</option><option>El Esteco</option></select></div>
            <div class="col-12"><div class="d-flex flex-wrap gap-2"><button class="filter-btn active" data-category="Todos">Todos</button><button class="filter-btn" data-category="Tinto">Tintos</button><button class="filter-btn" data-category="Blanco">Blancos</button><button class="filter-btn" data-category="Rosado">Rosados</button><button class="filter-btn" data-category="Espumoso">Espumosos</button></div></div>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4 fw-black mb-0">Resultados</h2><span class="text-muted" id="productCount"></span></div>
        <div class="row g-4" id="productGrid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>

  <script src="assets/js/company-scope.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="assets/js/motion-gsap.js"></script>
</body>
</html>
