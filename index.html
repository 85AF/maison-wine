<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050403">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <link href="assets/css/luxury-theme.css" rel="stylesheet">
  <link href="assets/css/company-split.css" rel="stylesheet">
  <title>Vitis / Maison Blanche</title>
</head>
<body class="company-entry-body" data-page="inicio">
  <button class="theme-toggle entry-theme-toggle" type="button" data-theme-toggle aria-label="Cambiar modo claro u oscuro"><i class="bi bi-sun"></i></button>
  <main class="company-entry" aria-label="Seleccionar colección">
    <a class="company-entry-card maison-side" href="maison-blanche.html" aria-label="Entrar a Maison Blanche">
      <div class="company-entry-reveal" aria-hidden="true"></div>
      <div class="company-entry-inner">
        <div class="company-entry-logo-stage"><img class="company-entry-logo maison-logo" src="assets/img/logo/logo-maison-blanche-entry.png" alt="Maison Blanche"></div>
        <div class="company-entry-bodegas">
          <span>Trapiche</span>
          <span>El Esteco</span>
        </div>
      </div>
    </a>
    <a class="company-entry-card vitis-side" href="vitis.html" aria-label="Entrar a Vitis">
      <div class="company-entry-reveal" aria-hidden="true"></div>
      <div class="company-entry-inner">
        <div class="company-entry-logo-stage"><img class="company-entry-logo vitis-logo" src="assets/img/logo/logo-vitis-entry.png" alt="Vitis"></div>
        <div class="company-entry-bodegas">
          <span>Ventisquero</span>
          <span>Argento</span>
          <span>Zonin</span>
          <span>Félix Solís</span>
        </div>
      </div>
    </a>
  </main>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="assets/js/motion-gsap.js"></script>
  <script src="assets/js/entry-barrel-reveal.js"></script>
</body>
</html>
